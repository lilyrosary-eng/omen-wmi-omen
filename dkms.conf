# dkms.conf —— 可选的 DKMS 打包（Debian/Ubuntu/Fedora 通用）
#
# ⚠ 未在本机验证：本机没装 dkms 包（`dpkg -l dkms` 为空），
#   当前内核升级靠 systemd oneshot `omen-wmi-ensure.sh` 重建。
#   装上 dkms 后可用：
#       sudo cp -r . /usr/src/hp-wmi-omen-0.1.0
#       sudo dkms add -m hp-wmi-omen -v 0.1.0
#       sudo dkms build -m hp-wmi-omen -v 0.1.0
#       sudo dkms install -m hp-wmi-omen -v 0.1.0
#
# 构建目录由 DKMS 决定；用 $dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build，
# 这是 DKMS 3.x 的实际布局（旧写法 `${dkms_tree}/omen-wmi-omen` 是错的）。
PACKAGE_NAME="hp-wmi-omen"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="hp-wmi-omen"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
